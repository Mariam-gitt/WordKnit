# CI = "continuous integration": GitHub runs these checks automatically on every push and every pull request,
# and shows a green tick (all good) or a red cross (something broke) next to the commit.

# The name shown in the GitHub "Actions" tab.
name: CI

# When to run: on every push to main, and on every pull request (so broken changes are caught BEFORE they are merged).
on:
  push:
    branches: [main]
  pull_request:

# A workflow is made of "jobs"; these two run at the same time on separate fresh Linux machines.
jobs:
  backend:
    # Which kind of machine to rent for free.
    runs-on: ubuntu-latest
    # Safety: if something hangs, stop after 10 minutes instead of waiting for hours.
    timeout-minutes: 10
    # A "service container" = a real MongoDB database started next to the tests, so the PDF-storage (GridFS) tests run against the real thing.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        # Wait until MongoDB answers a ping before the tests start.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Run every "run:" command inside the backend folder.
    defaults:
      run:
        working-directory: backend
    steps:
      # 1) Download your repository's code onto the machine.
      - uses: actions/checkout@v4
      # 2) Install Node.js 22 and cache downloaded packages so later runs are faster.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # 3) Install the exact package versions from package-lock.json. "tee" shows the output AND saves a copy to a file;
      #    "pipefail" makes the step fail if either command fails (otherwise tee would hide the failure).
      - name: Install packages
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee ../backend-log.txt
      # 4) Before running any test, check that the test database can really be reached, and say clearly if not.
      - name: Check the test database is reachable
        shell: bash
        env:
          # 127.0.0.1 instead of "localhost": some GitHub machines resolve "localhost" to an address the database container doesn't listen on.
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/wordknit_test
        run: |
          set -o pipefail
          { echo "--- docker containers ---"; docker ps -a --format '{{.Image}} | {{.Status}} | {{.Ports}}'; } 2>&1 | tee ../mongo-check.txt
          node - <<'EOF' 2>&1 | tee -a ../mongo-check.txt
          const { MongoClient } = require("mongodb");
          new MongoClient(process.env.TEST_MONGO_URI, { serverSelectionTimeoutMS: 10000 }).connect()
            .then(async (client) => { const r = await client.db().command({ ping: 1 }); console.log("MongoDB reachable, ping ok =", r.ok); await client.close(); })
            .catch((e) => { console.error("MongoDB NOT reachable:", e.message); process.exit(1); });
          EOF
      # 5) If the check failed, also print the database container's own log (why did it not accept connections?).
      - name: Database container log (only when the check failed)
        if: failure()
        shell: bash
        run: |
          docker logs "$(docker ps -aq --filter ancestor=mongo:7 | head -1)" 2>&1 | tail -40 | tee -a ../mongo-check.txt || true
      # 6) Run all tests.
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee -a ../backend-log.txt
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/wordknit_test
      # 7) ALWAYS (even when something failed) copy the logs onto the run's front page ("Summary"),
      #    so you can read what went wrong without opening any step.
      - name: Show the logs on the run summary page
        if: always()
        shell: bash
        run: |
          {
            echo '### Database check'
            echo '```'
            cat ../mongo-check.txt 2>/dev/null || echo "(not reached)"
            echo '```'
            echo '### Backend log (last 80 lines)'
            echo '```'
            tail -n 80 ../backend-log.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      # Same first two steps as above, for the frontend folder.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The frontend has no tests yet, but a successful production build proves the code compiles and every import resolves.
      - name: Install packages and build
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee ../frontend-log.txt
          npm run build 2>&1 | tee -a ../frontend-log.txt
      # Same trick: always show the end of the log on the run's front page.
      - name: Show the log on the run summary page
        if: always()
        shell: bash
        run: |
          {
            echo '### Frontend log (last 60 lines)'
            echo '```'
            tail -n 60 ../frontend-log.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
