services:

  # ── MongoDB ─────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: wk_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - wk_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Node / Express backend ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wk_backend
    restart: unless-stopped
    env_file: ./backend/.env.docker
    environment:
      - NODE_ENV=production
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - wk_net

  # ── PDF service (port 5001) ──────────────────────────────────────────
  pdf_service:
    build:
      context: ./backend
      dockerfile: Dockerfile.python
      args:
        SERVICE_FILE: pdf_service.py
        SERVICE_PORT: 5001
    container_name: wk_pdf
    restart: unless-stopped
    ports:
      - "5001:5001"
    networks:
      - wk_net

  # ── React frontend (served by Nginx) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wk_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - wk_net

volumes:
  mongo_data:

networks:
  wk_net:
    driver: bridge
